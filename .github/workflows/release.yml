name: Release APK

on:
  # Yalnızca manuel: release'ler yerel imzalı artefaktlarla (gerçek keystore)
  # elle yayınlanıyor; CI keystore secret'ı olmadan imzasız build üretir.
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API adresini geçersiz kıl (boşsa build-config.yaml kullanılır)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # Boşsa app.config.js build-config.yaml'daki aktif ortamı kullanır.
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node bağımlılıkları
        run: npm ci

      - name: Android projesini üret
        run: npx expo prebuild --platform android --no-install

      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Release keystore'u hazırla
        # Keystore repoda değil; CI'da base64 secret'tan yazılır. Secret yoksa
        # derleme yine çalışır (imza debug'a düşer) ama Play'e YÜKLENEMEZ.
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret yok — imza debug key ile yapılacak (Play'e yüklenemez)."
            exit 0
          fi
          mkdir -p release
          echo "$KEYSTORE_BASE64" | base64 -d > release/sup-port.keystore
          cat > keystore.properties <<EOF
          storeFile=release/sup-port.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Release AAB + APK derle
        working-directory: android
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: Artefaktları adlandır
        id: artifacts
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -z "$AAB" ] && { echo "AAB bulunamadı"; exit 1; }
          cp "$AAB" "sup-port-${VERSION}.aab"
          cp "$APK" "sup-port-${VERSION}.apk"
          echo "aab=sup-port-${VERSION}.aab" >> "$GITHUB_OUTPUT"
          echo "apk=sup-port-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          ls -lh sup-port-${VERSION}.*

      - name: Artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: sup-port-release
          path: |
            ${{ steps.artifacts.outputs.aab }}
            ${{ steps.artifacts.outputs.apk }}
          if-no-files-found: error

      - name: Release oluştur (yalnızca tag'de)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ steps.artifacts.outputs.aab }}" \
            "${{ steps.artifacts.outputs.apk }}" \
            --title "sup-port ${{ github.ref_name }}" \
            --notes "Kişisel gelişim superapp'i.

          - **.aab** — Play Console'a yüklemek için (bkz. RELEASE.md).
          - **.apk** — Samsung Galaxy S23'e doğrudan kurmak için.

          Uygulama backend'e build-config.yaml'daki adresten bağlanır; telefon o
          adrese erişebilmeli ve backend çalışıyor olmalıdır."
