name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck ve testler
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI kendi MongoDB servisini kullanır; Atlas bilgileri repoda yok.
      MONGODB_URI: mongodb://localhost:27017
      DB_NAME: support_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:8090
      # Test suite tek IP'den onlarca kullanıcı kaydeder; rate limit kapalı.
      RATE_LIMIT_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Node bağımlılıkları
        run: npm ci

      - name: Python bağımlılıkları
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements.txt

      - name: TypeScript tip kontrolü
        run: npx tsc --noEmit

      # Tarayıcı ikili dosyalarını (~150MB) önbellekle: her koşuda yeniden
      # indirilmez, ağ dalgalanmalarına daha dayanıklı olur.
      - name: Playwright tarayıcı önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Playwright tarayıcısı
        # Azure apt aynası ara sıra çok yavaş kalıp adımı kilitliyor; 3 kez
        # dener, aralarda kısa bekler. Böylece geçici ağ/apt hataları CI'ı
        # kırmıyor.
        run: |
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright kurulumu denemesi $i başarısız — 15 sn sonra tekrar denenecek"
            sleep 15
          done
          echo "::error::Playwright kurulumu 3 denemede de başarısız oldu"
          exit 1

      - name: Backend'i başlat
        run: |
          backend/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 4000 \
            --app-dir backend > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf "$API_URL/health" > /dev/null; then
              echo "API hazır ($i sn)"; exit 0
            fi
            sleep 1
          done
          echo "API başlamadı:"; cat /tmp/api.log; exit 1

      - name: Web sunucusunu başlat
        run: |
          npx expo start --web --port 8090 > /tmp/web.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf "$WEB_URL" > /dev/null; then
              echo "Web hazır ($i sn)"; exit 0
            fi
            sleep 1
          done
          echo "Web başlamadı:"; cat /tmp/web.log; exit 1

      - name: Playwright testleri
        run: npx playwright test --reporter=list

      - name: Sunucu logları (hata durumunda)
        if: failure()
        run: |
          echo "===== API ====="; tail -100 /tmp/api.log || true
          echo "===== WEB ====="; tail -100 /tmp/web.log || true

      - name: Test raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/.report
          retention-days: 7
          if-no-files-found: ignore

  secrets-guard:
    name: Gizli bilgi sızıntısı kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: config.yaml commit edilmemiş olmalı
        run: |
          if git ls-files --error-unmatch config.yaml 2>/dev/null; then
            echo "::error::config.yaml depoya girmiş — gerçek kimlik bilgileri sızabilir."
            exit 1
          fi
          echo "config.yaml takip edilmiyor."

      - name: Örnek yapılandırma bulunmalı
        run: test -f config.yaml.example

      - name: Takip edilen dosyalarda canlı bağlantı dizesi olmamalı
        run: |
          # Yalnızca gerçek kimlik bilgisi taşıyan mongodb+srv adreslerini arar;
          # config.yaml.example içindeki <yer-tutucu> biçimini yok sayar.
          if git grep -nIE 'mongodb\+srv://[^<[:space:]]+:[^<@[:space:]]+@' -- . ':!*.example' ':!.github/**'; then
            echo "::error::Takip edilen bir dosyada canlı MongoDB bağlantı dizesi var."
            exit 1
          fi
          echo "Canlı bağlantı dizesi bulunamadı."
