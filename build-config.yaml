# sup-port — uygulama derleme yapılandırması
#
# Buradaki değerler hem `expo start` (web/geliştirme) hem de APK/AAB derlemesi
# tarafından app.config.js üzerinden okunur. Bir değeri değiştirip yeniden
# derlemen yeterli:  bash scripts/build-aab.sh   (Play için)
#                    bash scripts/build-apk.sh   (yan yükleme/test için)
#
# NOT: Bu dosya gizli bilgi İÇERMEZ ve depoya girer.
#  - Backend'in MongoDB/JWT sırları: config.yaml (gitignore'lu)
#  - Release keystore parolaları: keystore.properties (gitignore'lu)

app:
  name: sup-port
  slug: sup-port
  android_package: app.support.tracker
  # Her Play yüklemesinde version_code MUTLAKA artmalı; Play aynı kodu iki kez
  # kabul etmez. version (adı) kullanıcıya görünür, semver ilerlet.
  version: "1.1.0"
  version_code: 3

# Play 2025 benchmark'ları: target >= 34 zorunlu, min 24 önerilir.
# Expo SDK 57 compileSdk 36 ile gelir; target'i de 36'da tutmak Play'i geçer.
sdk:
  min: 24
  target: 36
  compile: 36

# Uygulamanın bağlanacağı backend. Aktif ortam `environment` ile seçilir.
# TEST ve PRODUCTION adresleri karışmasın: release derlemesi 'production'
# bekler (aksi halde build-aab.sh uyarır ve REQUIRE_PRODUCTION=0 ister).
environment: lan   # seçenekler: lan | localhost | production
api:
  lan: http://10.40.30.213:4000
  localhost: http://localhost:4000
  production: https://support.medipol.dev

android:
  # Cleartext (düz metin http) trafiği API adresinin şemasından OTOMATİK
  # türetilir: lan/localhost (http) -> açık, production (https) -> kapalı.
  # Zorlamak istersen aç:  uses_cleartext_traffic: true

release:
  # Proguard/R8 kod küçültme + kaynak temizleme. Açınca APK/AAB küçülür ama
  # native modüller için kural gerekebilir; açtıktan sonra kritik akışları
  # cihazda yeniden test et.
  minify: true
  shrink_resources: true

theme:
  background: "#000000"
