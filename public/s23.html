<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sup-port — Galaxy S23</title>
<style>
  :root {
    --screen-w: 360px;   /* S23 logical viewport (1080 / DPR 3) */
    --screen-h: 780px;   /* S23 logical viewport (2340 / DPR 3) */
    --bezel: 12px;
    --radius: 46px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #16181d;
    color: #c9ced8;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
  }

  .stage {
    transform-origin: top center;
  }

  /* Phone body */
  .phone {
    position: relative;
    width: calc(var(--screen-w) + var(--bezel) * 2);
    height: calc(var(--screen-h) + var(--bezel) * 2);
    padding: var(--bezel);
    border-radius: var(--radius);
    background: linear-gradient(160deg, #3a3f47 0%, #23262b 40%, #2e3238 100%);
    box-shadow:
      0 0 0 1.5px #55595f,
      0 24px 60px rgba(0, 0, 0, .55),
      inset 0 0 0 1px rgba(255, 255, 255, .06);
  }

  /* Screen */
  .screen {
    position: relative;
    width: var(--screen-w);
    height: var(--screen-h);
    border-radius: calc(var(--radius) - var(--bezel));
    overflow: hidden;
    /* Matches the app's dark theme so there is no white flash while it boots. */
    background: #000;
  }

  .screen iframe {
    width: var(--screen-w);
    height: var(--screen-h);
    border: 0;
    display: block;
  }

  /* Punch-hole camera */
  .camera {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #0b0c0e;
    box-shadow: inset 0 0 0 1px rgba(90, 120, 160, .5);
    z-index: 2;
    pointer-events: none;
  }

  /* Simulated Android status bar (top). Overlays the app; the app insets its
     content by the same height (src/lib/insets.ts WEB_STATUS_BAR_H = 32). */
  .statusbar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .02em;
    z-index: 3;
    pointer-events: none;
  }
  .statusbar .icons { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; fill: #fff; }

  /* Simulated Android 3-button navigation bar (bottom). Height matches
     WEB_NAV_BAR_H = 48. Buttons are decorative (pointer-events: none). */
  .navbar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: rgba(0, 0, 0, .35);
    z-index: 3;
    pointer-events: none;
  }
  .navbar .navbtn { opacity: .9; }
  .navbar svg { display: block; stroke: #e8eaed; fill: none; }
  .navbar .home svg { fill: #e8eaed; stroke: none; }
  /* Geri tuşu gerçekten çalışır: uygulamaya postMessage gönderir. */
  .navbar .back { pointer-events: auto; cursor: pointer; padding: 10px 14px; border-radius: 8px; }
  .navbar .back:active { background: rgba(255,255,255,.12); }

  /* Side buttons (right edge: volume up/down + power) */
  .btn {
    position: absolute;
    right: -2.5px;
    width: 3px;
    border-radius: 0 2px 2px 0;
    background: linear-gradient(180deg, #4a4f57, #2b2e33);
  }
  .btn.vol-up  { top: 150px; height: 46px; }
  .btn.vol-dn  { top: 206px; height: 46px; }
  .btn.power   { top: 272px; height: 62px; }

  .caption {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    letter-spacing: .01em;
    color: #7d848f;
  }
  .caption strong { color: #c9ced8; font-weight: 600; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #3ddc84;
    box-shadow: 0 0 8px #3ddc84;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="phone">
      <div class="screen">
        <div class="camera"></div>
        <iframe src="/" title="sup-port app"></iframe>

        <!-- Durum çubuğu (saat + sinyal/wifi/pil) -->
        <div class="statusbar">
          <span class="clock" id="clock">9:41</span>
          <span class="icons">
            <!-- sinyal -->
            <svg width="16" height="11" viewBox="0 0 16 11" aria-hidden="true">
              <rect x="0" y="8" width="2.5" height="3" rx=".5"/>
              <rect x="4" y="6" width="2.5" height="5" rx=".5"/>
              <rect x="8" y="3.5" width="2.5" height="7.5" rx=".5"/>
              <rect x="12" y="0.5" width="2.5" height="10.5" rx=".5"/>
            </svg>
            <!-- wifi -->
            <svg width="15" height="11" viewBox="0 0 15 11" aria-hidden="true">
              <path d="M7.5 2.2c2.6 0 5 1 6.8 2.7l-1.4 1.4A7.7 7.7 0 0 0 7.5 4.2 7.7 7.7 0 0 0 2.1 6.3L0.7 4.9A9.7 9.7 0 0 1 7.5 2.2z"/>
              <path d="M7.5 5.8c1.4 0 2.7.5 3.7 1.5l-1.5 1.5a3 3 0 0 0-4.4 0L3.8 7.3A5.3 5.3 0 0 1 7.5 5.8z"/>
              <circle cx="7.5" cy="9.6" r="1.3"/>
            </svg>
            <!-- pil -->
            <svg width="24" height="12" viewBox="0 0 24 12" aria-hidden="true">
              <rect x="0.5" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#fff" stroke-opacity=".55"/>
              <rect x="2" y="2.5" width="14" height="7" rx="1.2"/>
              <rect x="21.5" y="4" width="2" height="4" rx="1"/>
            </svg>
          </span>
        </div>

        <!-- 3 tuşlu Android gezinme çubuğu (geri / ana ekran / son uygulamalar) -->
        <div class="navbar" aria-hidden="true">
          <span class="navbtn back" id="navBack" role="button" title="Geri" aria-label="Geri">
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="navbtn home">
            <svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
          </span>
          <span class="navbtn recent">
            <svg width="15" height="15" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" stroke-width="2.2"/></svg>
          </span>
        </div>
      </div>
      <div class="btn vol-up"></div>
      <div class="btn vol-dn"></div>
      <div class="btn power"></div>
    </div>
  </div>

  <div class="caption">
    <span class="dot"></span>
    <strong>Galaxy S23</strong>
    <span>360 × 780 CSS px · 1080 × 2340 @ 3x</span>
  </div>

  <script>
    // Shrink the phone to fit shorter windows without clipping.
    const stage = document.getElementById('stage');
    const naturalHeight = 780 + 12 * 2;
    function fit() {
      const available = window.innerHeight - 110;
      const scale = Math.min(1, available / naturalHeight);
      stage.style.transform = `scale(${scale})`;
      stage.style.height = `${naturalHeight * scale}px`;
    }
    fit();
    window.addEventListener('resize', fit);

    // Durum çubuğu saati (gerçek zaman, 24 saat).
    const clock = document.getElementById('clock');
    function tick() {
      const now = new Date();
      clock.textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    tick();
    setInterval(tick, 10000);

    // 3-tuşlu gezinme çubuğundaki geri tuşu → uygulamaya (iframe) geri komutu.
    const iframe = document.querySelector('iframe');
    document.getElementById('navBack').addEventListener('click', () => {
      iframe.contentWindow.postMessage({ type: 'sup-port-back' }, '*');
    });
  </script>
</body>
</html>
