# sup-port backend — Portainer stack (Git ile otomatik deploy).
#
# Portainer'da bu repoyu "Git repository" kaynaklı bir Stack olarak ekle ve
# aşağıdaki değişkenleri stack ortam değişkeni (Environment variables) olarak gir:
#   MONGODB_URI, DB_NAME, JWT_SECRET   (zorunlu)
#   PORT                               (opsiyonel, container içi port; varsayılan 4000)
#
# GIT_SHA otomatik ayarlanır: deploy workflow her push'ta bu değeri commit
# SHA'sına çeker; backend /version ucundan onu bildirir (canlı doğrulama).
#
# Port YAYINLANMAZ: backend main-network üzerinden erişilir. Proxy manager
# container'a adıyla ulaşır: fastapi-backend-${DB_NAME}-app:${PORT:-4000}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi-backend-${DB_NAME}-app
    restart: always
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT:-4000}
      # Deploy workflow her redeploy'da bunu yeni commit SHA'sıyla değiştirir.
      - GIT_SHA=${GIT_SHA:-unknown}
    pull_policy: build
    networks:
      - main-network

networks:
  main-network:
    external: true
